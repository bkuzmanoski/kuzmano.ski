<svg xmlns="http://www.w3.org/2000/svg" width="6" height="6" fill="none" viewBox="0 0 6 6">
  <defs>
    <filter
      id="disk-read-indicator-led-blur"
      width="10"
      height="10"
      x="-2"
      y="-2"
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
    <filter
      id="disk-read-indicator-highlight-blur"
      width="5.5"
      height="5.5"
      x=".125"
      y=".13"
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation=".5" />
    </filter>
  </defs>
  <mask
    id="disk-read-indicator-mask"
    width="6"
    height="6"
    x="0"
    y="0"
    maskUnits="userSpaceOnUse"
    style="mask-type: alpha"
  >
    <circle cx="3" cy="3" r="3" fill="#fff" />
  </mask>
  <g mask="url(#disk-read-indicator-mask)">
    <g class="led" filter="url(#disk-read-indicator-led-blur)">
      <circle cx="3" cy="3" r="3" fill="#45fd04" />
    </g>
    <g filter="url(#disk-read-indicator-highlight-blur)" opacity=".5" style="mix-blend-mode: plus-lighter">
      <path
        fill="#fff"
        d="M3.014 1.13c.683 0 1.28.363 1.611.906A1.889 1.889 0 0 0 2.031 4.63a1.889 1.889 0 0 1 .983-3.5Z"
      />
    </g>
  </g>
</svg>
